name: static

# 闈欐€佹鏌ュ眰锛氭墭绠?runner 鍙窇锛堝彧闇€瑕?git + PowerShell + host gcc锛夈€?# 瀹屾暣鏋勫缓 + 鍥炲綊鍦?full.yml锛堣嚜鎵樼 Windows runner锛岄渶瑕?tools/i686-elf 涓?QEMU锛夈€?# 鏂囨。锛歞ocs/ci.md
#
# 鏈?workflow 鍙仛"鑳藉湪绉掔骇璺戝畬"鐨勬鏌ワ細
#   - 宸ヤ綔鍖?绂佺敤浜х墿锛?AllowDirty锛歝heckout 鍚庣殑宸ヤ綔鍖虹敱 setup 鍐冲畾锛?#   - *.ps1/*.psm1 鐨?UTF-8 BOM + 璇硶瑙ｆ瀽锛?StrictBom锛氫笉鍐嶈眮鍏嶅巻鍙叉枃浠讹級
#   - tools/check-deps.ps1 妯″潡杈圭晫
#   - tools/unit.ps1 host 鍗曞厓娴嬭瘯锛坲buntu-latest 鑷甫 gcc锛?# 澶辫触鏃朵笂浼?obj/ci/** 鏃ュ織锛坱ranscript锛夛紝涓嶄吉閫犱换浣?宸叉瀯寤?宸插洖褰?缁撹銆?
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure PowerShell
        shell: bash
        run: |
          if command -v pwsh >/dev/null 2>&1; then
            echo "pwsh already present"
          else
            sudo apt-get update
            sudo apt-get install -y powershell
          fi
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Host compiler (unit tests)
        shell: bash
        run: |
          # path/pmm/fat16 host suites compile with -m32; ubuntu runners need multilib.
          sudo apt-get update
          sudo apt-get install -y gcc-multilib libc6-dev-i386
          gcc --version | head -1
          make --version | head -1
          gcc -m32 -print-file-name=libc.so
      - name: tools/ci.ps1 -Quick -StrictBom
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force obj/ci | Out-Null
          Start-Transcript -Path obj/ci/static.log -Force | Out-Null
          $code = 1
          try {
            & ./tools/ci.ps1 -Quick -AllowDirty -StrictBom
            $code = $LASTEXITCODE
          } finally {
            Stop-Transcript | Out-Null
          }
          if ($code -ne 0) { throw "ci.ps1 -Quick failed (exit=$code)" }

      - name: Upload static logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-logs
          path: |
            obj/ci/**
            serial-ci.log
          if-no-files-found: ignore
          retention-days: 7
